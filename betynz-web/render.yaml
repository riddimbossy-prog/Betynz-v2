services:
  - type: web
    name: betynz-web
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CACHE_TTL_SECONDS
        value: "120"
      - key: FIXTURE_BOARD_CACHE_TTL_SECONDS
        value: "60"
      - key: MATCH_INTELLIGENCE_CACHE_TTL_SECONDS
        value: "600"
      - key: ODDS_SNAPSHOT_INTERVAL_SECONDS
        value: "300"
      - key: LIVE_CACHE_TTL_SECONDS
        value: "20"
      - key: RESULTS_CACHE_TTL_SECONDS
        value: "300"
      - key: BETYNZ_DATA_API_BASE_URL
        sync: false
      - key: BETYNZ_DATA_API_KEY
        sync: false
      - key: BETYNZ_DATA_API_KEY_HEADER
        value: X-API-Key
      - key: BETYNZ_DATA_API_FIXTURES_PATH
        value: search_matches?date={date}&page=1&page_size=100
      - key: BETYNZ_DATA_API_PAGE_SIZE
        value: "100"
      - key: BETYNZ_DATA_API_MAX_PAGES
        value: "0"
      - key: BETYNZ_DATA_API_TIMEOUT_MS
        value: "60000"
      - key: BETYNZ_DATA_API_RETRIES
        value: "2"
      - key: BETYNZ_DATA_API_ENRICH_CONCURRENCY
        value: "3"
      - key: BETYNZ_DATA_API_MEDIA_BASE_URL
        value: https://www.sportybet.com/
      - key: BETYNZ_DATA_API_FIXTURE_STATS_PATH
        value: get_fixture_stats
      - key: BETYNZ_DATA_API_TEAM_HISTORY_PATH
        value: get_team_history
      - key: BETYNZ_DATA_API_TEAM_STREAKS_PATH
        value: get_team_streaks
      - key: BETYNZ_DATA_API_STANDINGS_PATH
        value: get_standings
      - key: BETYNZ_DATA_API_COMPETITION_STATS_PATH
        value: get_competition_stats
      - key: BETYNZ_DATA_API_LIVE_PATH
        value: live
      - key: BETYNZ_DATA_API_RESULTS_PATH
        value: results
      - key: BETYNZ_DATA_API_EVENTS_PATH
        value: events
      - key: BETYNZ_DATA_API_EVENT_ID_PARAM
        value: event_id
      - key: PPG_ROUTE_CACHE_TTL_SECONDS
        value: "1800"
      - key: CONVERGENCE_ROUTE_CACHE_TTL_SECONDS
        value: "1800"
      - key: STATS_ROUTE_CACHE_TTL_SECONDS
        value: "1800"
      - key: CONSENSUS_FREEZE_MINUTES
        value: "30"
      - key: CONSENSUS_CACHE_TTL_SECONDS
        value: "180"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTO_SETTLEMENT_ENABLED
        value: "true"
      - key: AUTO_SETTLEMENT_INTERVAL_MINUTES
        value: "30"
