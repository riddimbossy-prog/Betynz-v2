<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Betynz Admin Sign In</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Betynz">
  <link rel="apple-touch-startup-image" href="/assets/pwa-splash-portrait.png" media="(orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/assets/pwa-splash-landscape.png" media="(orientation: landscape)">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin-login.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <a class="brand brand-logo" href="/" aria-label="Betynz home"><img src="/assets/betynz-logo.png" alt="Betynz.com"><small>Secure administration</small></a>
    <section class="login-card">
      <span class="eyebrow">PROTECTED ADMIN</span>
      <h1>Sign in to Betynz</h1>
      <p>Use the Supabase admin account created for Betynz.</p>
      <form id="login-form">
        <label>Email<input id="login-email" type="email" autocomplete="username" required></label>
        <label>Password<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" class="primary-button" type="submit">Sign in</button>
      </form>
      <p id="login-message" class="login-message" aria-live="polite"></p>
      <a class="back-link" href="/">← Return to fixture board</a>
    </section>
  </main>
  <script src="/admin-login.js" defer></script>
<script type="module" src="/motion.js?v=5.0.16"></script></body>
</html>
