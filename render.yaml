services:
  - type: web
    name: betynz
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_BASE_URL
        value: "https://v3.football.api-sports.io"
      - key: API_FOOTBALL_KEY_HEADER
        value: "x-apisports-key"
      - key: API_FOOTBALL_TIMEOUT_MS
        value: "20000"
      - key: API_FOOTBALL_RETRIES
        value: "2"
      - key: API_FOOTBALL_CACHE_TTL_SECONDS
        value: "1800"
      - key: API_FOOTBALL_FIXTURE_CACHE_TTL_SECONDS
        value: "120"
      - key: API_FOOTBALL_ODDS_CACHE_TTL_SECONDS
        value: "300"
      - key: API_FOOTBALL_VISUAL_CACHE_TTL_SECONDS
        value: "604800"
      - key: API_FOOTBALL_MEDIA_BASE_URL
        value: "https://media.api-sports.io/football"
      - key: API_FOOTBALL_MEDIA_CONCURRENCY
        value: "6"
