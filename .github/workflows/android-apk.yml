name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare Betynz APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk betynz.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: betynz-android-apk-${{ github.sha }}
          path: betynz.apk
          if-no-files-found: error
          retention-days: 14
