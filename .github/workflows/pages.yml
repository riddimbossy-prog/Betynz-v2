name: Refresh and deploy Betynz
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: betynz-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check && npm test
      - uses: actions/cache/restore@v4
        with:
          path: .cache/http
          key: football-v7-${{ github.run_id }}
          restore-keys: football-v7-
      - name: Fetch Sportybet markets and analyse daily fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SPORTYBET_COUNTRY: ${{ vars.SPORTYBET_COUNTRY || 'gh' }}
          BOARD_DAYS: '3'
        run: npm run refresh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/http
          key: football-v7-${{ github.run_id }}
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: betynz-data-audit
          path: data/
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
